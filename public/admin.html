<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCRM AI - Dashboard de Leads</title>
  <style>
    :root {
      --bg-dark: #121214;
      --panel-dark: #1a1a1e;
      --accent-color: #e50914;
      --text-main: #ffffff;
      --text-muted: #a0a0a5;
      --border-color: #2a2a30;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 30px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background-color: var(--accent-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .refresh-btn {
      background-color: #26262b;
      color: white;
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .table-container {
      background-color: var(--panel-dark);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #222226;
      padding: 16px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background-color: #222228;
    }

    .tag-operacion {
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      display: inline-block;
    }

    .tag-operacion.COMPRA {
      background-color: rgba(0, 230, 118, 0.15);
      color: #00e676;
      border: 1px solid #00e676;
    }

    .tag-operacion.VENTA {
      background-color: rgba(229, 9, 20, 0.15);
      color: #ff5252;
      border: 1px solid #ff5252;
    }

    .phone-link {
      color: #40c4ff;
      text-decoration: none;
      font-weight: 500;
    }

    .phone-link:hover {
      text-decoration: underline;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🚗 AutoCRM AI <span class="badge">Panel de Leads</span></h1>
      <button class="refresh-btn" onclick="cargarLeads()">🔄 Actualizar Datos</button>
    </header>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Operación</th>
            <th>Vehículo</th>
            <th>Detalles</th>
          </tr>
        </thead>
        <tbody id="leads-body">
          <tr>
            <td colspan="6" class="empty-state">Cargando leads desde Supabase...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function cargarLeads() {
      const tbody = document.getElementById("leads-body");
      
      try {
        const response = await fetch("/api/leads");
        const data = await response.json();

        if (!data.leads || data.leads.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No hay leads registrados todavía.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.leads.map(lead => {
          const fecha = new Date(lead.created_at).toLocaleString('es-ES', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });

          const opClass = lead.operacion ? lead.operacion.toUpperCase() : '';

          return `
            <tr>
              <td style="color: var(--text-muted); font-size: 0.85rem;">${fecha}</td>
              <td><strong>${lead.nombre || 'Sin nombre'}</strong></td>
              <td>
                ${lead.telefono 
                  ? `<a href="tel:${lead.telefono}" class="phone-link">📞 ${lead.telefono}</a>` 
                  : '<span style="color: var(--text-muted);">Sin teléfono</span>'}
              </td>
              <td>
                <span class="tag-operacion ${opClass}">${lead.operacion || 'N/A'}</span>
              </td>
              <td><strong>${lead.vehiculo || '-'}</strong></td>
              <td style="color: var(--text-muted);">${lead.detalles || '-'}</td>
            </tr>
          `;
        }).join("");

      } catch (error) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state" style="color: #ff5252;">Error al cargar los leads desde el servidor.</td></tr>`;
      }
    }

    // Carga inicial al abrir la página
    cargarLeads();
  </script>
</body>
</html>
